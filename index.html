<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestrateur</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1b1f24; --muted: #5f6b7a; --border: #dde2e8;
  --accent: #2f6fde; --ok: #1f9d55; --warn: #c27c0e; --bad: #d23f3f; --info: #6b5bd2;
  --mono: ui-monospace, "Cascadia Code", Consolas, "SFMono-Regular", monospace;
}
:root { --m-opus: #7a4fd6; --m-fable: #c2410c; --m-sonnet: #2f6fde; --m-haiku: #1f9d55; --m-other: #5f6b7a; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --panel: #171b21; --panel-2: #1e232b; --text: #e6e9ee; --muted: #93a0b0; --border: #2a313b;
    --accent: #6d9eff; --ok: #3ccf7d; --warn: #f0a93b; --bad: #ff6b6b; --info: #a596ff;
    --m-opus: #b197ff; --m-fable: #ff9b5e; --m-sonnet: #6d9eff; --m-haiku: #3ccf7d; --m-other: #93a0b0; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px;
  background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { font-size: 17px; margin: 0; font-weight: 650; }
header .sp { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); } .badge.info { color: var(--info); } .badge.accent { color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.dot.live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
main { padding: 16px 20px 40px; max-width: 1500px; margin: 0 auto; }
.alerts { display: grid; gap: 8px; margin-bottom: 14px; }
.alert { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); display: flex; gap: 10px; align-items: baseline; }
.alert.bad { border-color: var(--bad); } .alert.warn { border-color: var(--warn); } .alert.info { border-color: var(--accent); }
.alert b { white-space: nowrap; }
.stepper { display: grid; grid-template-columns: repeat(var(--n, 9), minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; }
.step { padding: 8px 8px 7px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); min-width: 0; }
.step .n { font-size: 11px; color: var(--muted); font-weight: 600; }
.step .l { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.done { opacity: .62; } .step.done .n::after { content: " ✓"; color: var(--ok); }
.step.live { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.step.live .n { color: var(--accent); }
.step.skip { opacity: .35; text-decoration: line-through; }
.grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
section.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; min-width: 0; }
section.card > h2 { margin: 0; padding: 11px 14px; font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
section.card > h2 .count { color: var(--muted); font-weight: 500; }
section.card > h2 .sp { flex: 1; }
.body { padding: 10px 14px; }
.empty { color: var(--muted); padding: 14px; font-size: 13px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
/* sessions */
.sess { display: grid; gap: 2px; padding: 9px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.sess:last-child { border-bottom: 0; }
.sess:hover { background: var(--panel-2); }
.sess.sel { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.sess.child { padding-left: 34px; }
.sess .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.sess .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sess .meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.sess .meta span { min-width: 0; overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 0 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--border); font-size: 11.5px; font-family: var(--mono); color: var(--muted); white-space: nowrap; }
.kind { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
.c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); } .c-muted { color: var(--muted); } .c-accent { color: var(--accent); } .c-info { color: var(--info); }
/* activité */
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
button.f { font: inherit; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer; }
button.f.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.feed { max-height: 560px; overflow: auto; }
.ev { display: grid; grid-template-columns: 64px auto minmax(0, 1fr); gap: 4px 10px; padding: 6px 14px; border-bottom: 1px solid var(--border); align-items: baseline; }
.ev:last-child { border-bottom: 0; }
.ev.new { animation: flash 1.8s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
.ev .t { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ev .who { display: flex; gap: 6px; align-items: center; min-width: 0; }
.ev .what { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; min-width: 0; }
.ev.blocked .what { color: var(--bad); }
.tool { font-size: 11.5px; font-weight: 700; padding: 0 6px; border-radius: 5px; background: var(--panel-2); white-space: nowrap; }
.tool.Bash, .tool.PowerShell { color: var(--accent); } .tool.Edit, .tool.Write, .tool.MultiEdit { color: var(--ok); }
.tool.Agent, .tool.Task { color: var(--info); } .tool.Workflow { color: var(--warn); } .tool.session { color: var(--warn); }
/* listes */
.list { max-height: 380px; overflow: auto; }
.row { padding: 6px 14px; border-bottom: 1px solid var(--border); font-size: 13px; overflow-wrap: anywhere; }
.row:last-child { border-bottom: 0; }
.row .ts { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-right: 6px; }
/* quotas */
.q { margin: 8px 0 12px; }
.q .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
.bar { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--border); }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .6s; }
.bar > i.warn { background: var(--warn); } .bar > i.bad { background: var(--bad); }
/* workflows */
.wf { padding: 9px 14px; border-bottom: 1px solid var(--border); display: grid; gap: 5px; }
.wf:last-child { border-bottom: 0; }
.wf .tasks { display: flex; gap: 4px; flex-wrap: wrap; }
/* carte en direct (SVG dessiné à la main : la CSP interdit toute bibliothèque externe) */
.full { margin-bottom: 16px; }
.diagram { overflow-x: auto; padding: 4px 6px 6px; }
.diagram svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; padding: 0 14px 10px; font-size: 12px; color: var(--muted); align-items: center; }
.legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid currentColor; vertical-align: -2px; margin-right: 5px; }
.legend .sw.dash { border-style: dashed; }
svg .colh { font-size: 10.5px; font-weight: 700; fill: var(--muted); letter-spacing: .06em; }
svg .bub { cursor: pointer; transition: transform .6s ease, opacity .4s; outline: none; }
svg .bub .bg { fill: var(--panel); stroke: none; }
svg .bub .ring { fill: none; stroke: var(--rc, var(--border)); stroke-width: 2.6; transition: stroke .3s; }
svg .bub .gauge { fill: none; stroke: var(--rc, var(--accent)); stroke-width: 4.5; stroke-linecap: round; }
svg .bub .gtrack { fill: none; stroke: var(--border); stroke-width: 4.5; }
svg .bub .halo { fill: none; stroke: var(--rc, var(--accent)); stroke-width: 7; opacity: 0; }
svg .bub.run .halo { animation: halo 2s ease-in-out infinite; }
svg .bub.refused .ring, svg .bub.bad .ring { stroke: var(--bad); }
svg .bub.refused .halo { stroke: var(--bad); animation: halo .8s ease-in-out infinite; }
svg .bub.silent .ring { stroke-dasharray: 5 4; }
svg .bub.dim > :not(.bg):not(.halo) { opacity: .5; }
svg .bub.dim .ring { stroke: var(--border); }
svg .bub:hover .bg, svg .bub:focus-visible .bg { fill: var(--panel-2); }
svg .bub.sel .bg { fill: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
svg .bub.sel .ring { stroke-width: 4.5; }
svg .bub.sel .lb { fill: var(--accent); }
svg .bub .ic { fill: none; stroke: var(--ic, var(--muted)); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg .bub .v { font-size: 12.5px; font-weight: 700; fill: var(--vc, var(--text)); text-anchor: middle; }
svg .bub .sb { font-size: 10.5px; fill: var(--sc, var(--muted)); text-anchor: middle; }
svg .bub .lb { font-size: 12px; font-weight: 600; fill: var(--text); text-anchor: middle; }
svg .bub .lb2 { font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
svg .bub .cnt circle { fill: var(--rc, var(--accent)); }
svg .bub .cnt text { font-size: 10.5px; font-weight: 700; fill: var(--panel); text-anchor: middle; }
svg .bub .tag rect { fill: var(--panel-2); stroke: var(--info); stroke-width: 1; }
svg .bub .tag text { font-size: 9px; font-weight: 700; fill: var(--info); text-anchor: middle; letter-spacing: .04em; }
svg .lnk path { fill: none; }
svg .lnk .base { stroke: var(--border); stroke-width: 1.5; transition: stroke .4s; }
svg .lnk.on .base { stroke: color-mix(in srgb, var(--ec, var(--accent)) 55%, transparent); stroke-width: 1.8; }
svg .lnk.off { opacity: .55; }
svg .lnk circle { fill: var(--ec, var(--accent)); }
@keyframes halo { 0%,100% { opacity: 0; } 50% { opacity: .28; } }
/* déplacement des bulles à la souris, au doigt ou au clavier (flèches) */
svg .bub { touch-action: none; }
svg .bub.dragging { transition: none; cursor: grabbing; }
svg .bub.dragging .bg { fill: var(--panel-2); }
svg .bub.dragging .ring { stroke-width: 4; }
/* sens du flux : tirets qui avancent de la source vers la cible */
svg .lnk .flow { fill: none; stroke: var(--ec, var(--accent)); stroke-width: 2.2; stroke-dasharray: 2 12; stroke-linecap: round; opacity: 0; }
svg .lnk.on .flow { opacity: .85; animation: march 1.1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -14; } }
/* paquet : un échange réel (commande, appel d'outil, lancement d'agent, rapport…) qui part de l'émetteur vers le destinataire */
svg .pkts { pointer-events: none; }
svg .pkt circle { fill: var(--pc, var(--accent)); stroke: var(--panel); stroke-width: 1.5; filter: drop-shadow(0 0 5px var(--pc, var(--accent))); }
svg .pkt text { font-size: 10.5px; font-weight: 700; fill: var(--pc, var(--accent)); text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 3.5px; stroke-linejoin: round; }
svg .rip { fill: none; stroke: var(--pc, var(--accent)); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: rip .9s ease-out forwards; pointer-events: none; }
@keyframes rip { from { transform: scale(1); opacity: .85; } to { transform: scale(1.5); opacity: 0; } }
.legend .pk { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); vertical-align: 0; margin-right: 5px; }
@media (prefers-reduced-motion: reduce) { svg .bub.run .halo, svg .bub.refused .halo, svg .lnk.on .flow, svg .rip { animation: none; } svg .lnk circle, svg .rip { display: none; } }
.detail { border-top: 1px solid var(--border); padding: 10px 14px 12px; display: grid; gap: 8px; }
.detail .dh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.detail .dh b { font-size: 14px; }
.detail .dh .sp { flex: 1; }
.detail .desc { color: var(--muted); font-size: 12.5px; }
.detail table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.detail th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--border); }
.detail td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
.detail tr:last-child td { border-bottom: 0; }
.detail .scroll { overflow-x: auto; max-height: 320px; overflow-y: auto; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 10px; }
@media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr); } .stepper { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
/* actions humaines pas à pas */
.hsec { margin-bottom: 14px; border-color: var(--warn); }
.htasks { display: grid; gap: 0; }
.htask { padding: 12px 14px 14px; border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
.htask:last-child { border-bottom: 0; }
.htask .hh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.htask .hh .t { font-weight: 650; min-width: 0; overflow-wrap: anywhere; }
.htask .hh .sp { flex: 1; }
.htask .sum { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.hbar { display: flex; gap: 4px; }
.hbar button { flex: 1; height: 6px; border-radius: 3px; border: 0; padding: 0; background: var(--panel-2); cursor: pointer; outline-offset: 2px; }
.hbar button.done { background: var(--ok); } .hbar button.cur { background: var(--accent); }
.hstep { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 12px; border-radius: 10px; background: var(--panel-2); }
.hstep .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent); color: #fff; }
.hstep .txt { font-size: 14.5px; line-height: 1.5; overflow-wrap: anywhere; padding-top: 6px; }
.hstep .txt a { color: var(--accent); }
.hstep .acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.hbtn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
  color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; max-width: 100%; }
.hbtn:hover { border-color: var(--accent); }
.hbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.hbtn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.hbtn .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hbtn code { font-family: var(--mono); font-size: 12.5px; }
.hbtn[disabled] { opacity: .4; cursor: default; }
.hnav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hnav .sp { flex: 1; }
.hnote { font-size: 12px; color: var(--muted); }
.hnote.bad { color: var(--bad); } .hnote.ok { color: var(--ok); }
.hbar span { flex: 1; height: 6px; border-radius: 3px; background: var(--panel-2); }
.hbar span.done { background: var(--ok); } .hbar span.cur { background: var(--accent); }
.where { grid-column: 2; display: grid; gap: 6px; margin-top: 6px; padding: 10px 12px; border-radius: 8px; background: var(--panel); border: 1px dashed var(--border); }
.where .wt { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.where .wrow { display: grid; grid-template-columns: minmax(150px, max-content) minmax(0, 1fr); gap: 4px 12px; align-items: baseline; }
.where .wk { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.where .wv { overflow-wrap: anywhere; word-break: break-all; color: var(--accent); }
span.wv { color: var(--text); word-break: normal; }
.hbtn.big { padding: 10px 18px; font-size: 14px; }
.hstep .num.ok { background: var(--ok); }
.hnext { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 14px 12px; font-size: 12.5px; }
.chipbtn { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chipbtn:hover { border-color: var(--accent); } .chipbtn.done { color: var(--muted); }
.hdone { padding: 10px 14px 0; font-size: 13px; }
@media (max-width: 560px) { .hstep { grid-template-columns: 28px minmax(0, 1fr); padding: 10px; } .hstep .num { width: 28px; height: 28px; } .hstep .acts, .where { grid-column: 1 / -1; } .where .wrow { grid-template-columns: 1fr; } .hnav .hbtn { flex: 1; justify-content: center; } }
@media (max-width: 560px) { header, main { padding-left: 16px; padding-right: 16px; } .ev { grid-template-columns: 56px minmax(0, 1fr); } .ev .what { grid-column: 1 / -1; } }
</style>
<style>
[hidden] { display: none !important; }
/* sélecteur de projet et langue */
.psel { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.psel select { font: inherit; font-size: 13px; color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 3px 8px; max-width: 340px; }
#badges { display: inline-flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 560px) { .psel select { max-width: 200px; } }
</style>
</head>
<body>
<header>
  <h1 id="title" data-t="app">Orchestrateur</h1>
  <span id="badges"></span>
  <span id="run" class="badge"></span>
  <label id="projBox" class="psel" hidden><span data-t="project">Projet</span><select id="projSel"></select><span id="projOthers" class="badge warn" hidden></span></label>
  <span class="sp"></span>
  <span id="conn" class="badge warn"><span class="dot"></span></span>
  <span id="updated" class="muted" style="font-size:12px"></span>
  <button id="langBtn" class="f" type="button">English</button>
</header>
<main>
  <section id="humanCard" class="card full hsec" hidden><h2><span data-t="human.title"></span> <span id="humanCount" class="count"></span><span class="sp"></span><span class="muted" style="font-weight:400;font-size:12px" data-t="human.hint"></span></h2><div id="human" class="htasks"></div></section>
  <div id="alerts" class="alerts"></div>
  <div id="stepper" class="stepper" hidden></div>
  <section class="card full"><h2><span data-t="map.title"></span> <span id="mapCount" class="count"></span><span class="sp"></span><span id="mapModels" class="toolbar"></span><button id="mapReset" class="f" type="button" hidden data-t="map.reset" data-tt="map.resetTip"></button></h2>
    <div id="map" class="diagram"></div>
    <div class="legend">
      <span><span class="sw c-ok"></span><span data-t="lg.run"></span></span><span><span class="sw c-warn"></span><span data-t="lg.wait"></span></span><span><span class="sw dash c-warn"></span><span data-t="lg.silent"></span></span>
      <span><span class="sw c-bad"></span><span data-t="lg.bad"></span></span><span><span class="sw c-muted"></span><span data-t="lg.idle"></span></span>
      <span><span class="pk"></span><span data-t="lg.packet"></span></span>
      <span data-t="lg.rest"></span>
    </div>
    <div id="mapDetail" class="detail" hidden></div></section>
  <div class="grid">
    <div class="col">
      <section class="card"><h2><span data-t="sess.title"></span> <span id="sessCount" class="count"></span><span class="sp"></span><span class="muted" style="font-weight:400;font-size:12px" data-t="sess.hint"></span></h2><div id="sessions"></div></section>
      <section class="card"><h2><span data-t="act.title"></span> <span id="actCount" class="count"></span><span class="sp"></span><span id="actFilter" class="toolbar"></span></h2><div id="activity" class="feed"></div></section>
    </div>
    <div class="col">
      <section class="card"><h2><span data-t="q.title"></span> <span class="sp"></span><span id="qAge" class="muted" style="font-weight:400;font-size:12px"></span></h2><div id="quotas" class="body"></div></section>
      <section id="wfCard" class="card"><h2><span data-t="wf.title"></span> <span id="wfCount" class="count"></span></h2><div id="workflows"></div></section>
      <section class="card"><h2><span data-t="j.title"></span> <span id="jCount" class="count"></span></h2><div id="journal" class="list"></div></section>
      <section class="card"><h2 id="inboxTitle"></h2><div id="inbox"></div></section>
      <section class="card"><h2 id="feedTitle"></h2><div id="feed" class="list"></div></section>
    </div>
